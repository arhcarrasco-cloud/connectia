<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- LIGA UNICA del ERP: https://erp.connectia.mx
     Este archivo existe para que connectia.mx/erp no muera con un 404.
     GitHub Pages no puede emitir un 301 real, por eso es meta refresh + canonical,
     igual que el stub de /flotillas. No agregar aqui nada de la app.
     El ERP vive en Vercel, en otro repo (arhcarrasco-cloud/connectia-erp).

     OJO: solo cubre /erp y /erp/. Las subrutas (connectia.mx/erp/crm) las atiende
     GitHub Pages con su propio 404 antes de llegar aqui; para cubrirlas haria falta
     un 404.html en la raiz del sitio, que afectaria a todo connectia.mx. -->
<link rel="canonical" href="https://erp.connectia.mx">
<meta name="robots" content="noindex,follow">
<meta http-equiv="refresh" content="0;url=https://erp.connectia.mx">
<title>Connectia ERP</title>
<script>location.replace('https://erp.connectia.mx' + location.search + location.hash);</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:Inter,-apple-system,'Helvetica Neue',Arial,sans-serif;background:#201040;color:#fff}
  a{color:#C8FF00}
</style>
</head>
<body>
  <p>Redirigiendo a <a href="https://erp.connectia.mx">Connectia ERP</a>…</p>
</body>
</html>
