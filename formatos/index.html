<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Formatos · Connectia</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --indigo:#201040; --violet-mid:#502090; --violet:#6030A0; --violet-hot:#7B3FF2;
  --lime:#C8FF00; --citrus:#FF6A1A;
  --ink:#0A0118; --graphite:#1F1B2E; --slate:#6B6580; --mist:#E9E6F0; --paper:#FAFAFB; --white:#fff;
  --hero:linear-gradient(135deg,#201040 0%,#502090 50%,#6030A0 100%);
  --radius:18px; --shadow:0 10px 40px rgba(32,16,64,.18);
  --ok:#1f9d55; --warn:#d97706; --bad:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55}
a{color:var(--violet-hot);text-decoration:none}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:var(--violet-hot)}
.hidden{display:none!important}
.wordmark{font-weight:800;letter-spacing:-.04em;font-size:22px}
.wordmark.light{color:#fff}
button{font-family:inherit;cursor:pointer;border:none;border-radius:999px;font-weight:600;transition:.15s}
.btn-primary{background:var(--violet);color:#fff;padding:13px 26px;font-size:15px}
.btn-primary:hover{background:var(--violet-hot)}
.btn-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4);padding:11px 22px}
.btn-line{background:#fff;color:var(--violet);border:1.5px solid var(--mist);padding:10px 18px;font-size:14px}
.btn-line:hover{border-color:var(--violet)}
.btn-ok{background:var(--ok);color:#fff;padding:12px 22px}
.btn-bad{background:#fff;color:var(--bad);border:1.5px solid #f3c2c2;padding:12px 22px}
.btn-bad:hover{background:#fef2f2}
.btn-sm{padding:7px 14px;font-size:13px}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:11px 13px;border:1.5px solid var(--mist);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--violet-hot)}
label{font-size:12px;font-weight:600;color:var(--slate);display:block;margin-bottom:5px}
.container{max-width:1120px;margin:0 auto;padding:0 22px}
.topbar{position:sticky;top:0;z-index:50;background:var(--indigo);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;flex-wrap:wrap;gap:10px}
.topbar .nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.navlink{color:rgba(255,255,255,.8);background:transparent;padding:8px 14px;font-size:14px;border-radius:999px}
.navlink:hover,.navlink.active{background:rgba(255,255,255,.12);color:#fff}
.userchip{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--violet-hot));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.rolepill{font-size:10px;text-transform:uppercase;letter-spacing:.1em;background:rgba(123,63,242,.25);padding:3px 9px;border-radius:999px;border:1px solid rgba(123,63,242,.5)}
.hero{background:var(--hero);color:#fff;padding:64px 0 80px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,6vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1.02;margin:14px 0 16px;max-width:760px}
.hero p{font-size:18px;color:rgba(255,255,255,.82);max-width:560px}
.hero .num{position:absolute;right:-10px;top:10px;font-size:200px;font-weight:800;color:rgba(255,255,255,.05);line-height:1}
.section{padding:54px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:28px}
.card{background:#fff;border:1px solid var(--mist);border-radius:var(--radius);padding:26px;display:flex;flex-direction:column;gap:12px;transition:.18s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card .ic{font-size:34px}
.card h3{font-size:20px;font-weight:700;letter-spacing:-.01em}
.card p{font-size:14px;color:var(--slate);flex:1}
.card .accent{position:absolute;top:0;left:0;width:100%;height:5px}
.chain{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--slate)}
.chain .step{background:var(--mist);padding:3px 9px;border-radius:999px;font-weight:600}
.soon{position:absolute;top:16px;right:16px;font-size:10px;text-transform:uppercase;letter-spacing:.12em;background:var(--ink);color:#fff;padding:4px 10px;border-radius:999px;opacity:.85}
.card.disabled{opacity:.72}.card.disabled:hover{transform:none;box-shadow:none}
.auth-wrap{min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;background:var(--hero);padding:30px}
.auth-card{background:#fff;border-radius:24px;padding:40px;width:100%;max-width:430px;box-shadow:var(--shadow)}
.auth-card h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
.auth-card .sub{color:var(--slate);font-size:14px;margin-bottom:24px}
.field{margin-bottom:15px}
.switch{text-align:center;margin-top:18px;font-size:14px;color:var(--slate)}
.switch b{color:var(--violet-hot);cursor:pointer}
.msg{padding:11px 14px;border-radius:12px;font-size:13px;margin-bottom:14px}
.msg.err{background:#fef2f2;color:var(--bad);border:1px solid #f3c2c2}
.msg.ok{background:#f0fdf4;color:var(--ok);border:1px solid #bbf7d0}
.page{padding:36px 0 80px}
.panel{background:#fff;border:1px solid var(--mist);border-radius:var(--radius);padding:28px;margin-bottom:22px}
.panel h2{font-size:20px;font-weight:700;margin-bottom:4px;letter-spacing:-.01em}
.panel .ph{color:var(--slate);font-size:13px;margin-bottom:20px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:680px){.fgrid{grid-template-columns:1fr}}
.field-mb{margin-bottom:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--mist);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:680px}
thead th{background:#1A0B3D;color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:11px 10px;text-align:left}
tbody td{padding:7px 8px;border-bottom:1px solid var(--mist);vertical-align:middle}
tbody td input,tbody td select{padding:8px 9px;border-radius:8px;font-size:13px}
.t-del{background:#fef2f2;color:var(--bad);border-radius:8px;width:30px;height:30px;font-size:16px;line-height:1}
.totalbar{display:flex;justify-content:flex-end;align-items:center;gap:18px;margin-top:14px}
.totalbox{background:var(--violet-hot);color:#fff;font-weight:700;font-size:18px;padding:12px 22px;border-radius:12px}
.drop{border:2px dashed var(--mist);border-radius:14px;padding:26px;text-align:center;color:var(--slate);cursor:pointer;transition:.15s}
.drop:hover{border-color:var(--violet-hot);background:#faf7ff}
.att-list{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.att{display:flex;align-items:center;gap:12px;border:1px solid var(--mist);border-radius:12px;padding:10px 14px;font-size:14px}
.att .tag{font-size:10px;font-weight:700;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.tag.pdf{background:#fee2e2;color:#b91c1c}.tag.xml{background:#dbeafe;color:#1d4ed8}.tag.otro{background:var(--mist);color:var(--slate)}
.att .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .sz{color:var(--slate);font-size:12px}
.legalbox{background:var(--paper);border:1px solid var(--mist);border-radius:12px;padding:18px 20px;font-size:13px;color:var(--graphite);line-height:1.6}
.legalbox .t{display:flex;gap:10px;margin-bottom:10px}
.legalbox .t b{color:var(--violet);font-weight:700;min-width:24px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;text-transform:capitalize}
.st-borrador{background:var(--mist);color:var(--slate)}.st-pendiente{background:#fef3c7;color:#92400e}
.st-aprobado{background:#dcfce7;color:#166534}.st-rechazado{background:#fee2e2;color:#991b1b}
.list-item{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--mist);border-radius:14px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:.15s}
.list-item:hover{border-color:var(--violet);box-shadow:var(--shadow)}
.list-item .folio{font-weight:700;font-size:14px}
.list-item .meta{font-size:12px;color:var(--slate)}
.list-item .amt{margin-left:auto;font-weight:700;font-size:15px;text-align:right;white-space:nowrap}
.empty{text-align:center;color:var(--slate);padding:50px 20px}.empty .ic{font-size:46px;opacity:.5}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{background:#fff;border:1.5px solid var(--mist);color:var(--slate);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600}
.chip.on{background:var(--violet);color:#fff;border-color:var(--violet)}
.tl{display:flex;flex-direction:column}
.tl-step{display:flex;gap:14px}
.tl-dot{display:flex;flex-direction:column;align-items:center}
.tl-dot .circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;border:2px solid var(--mist);background:#fff;color:var(--slate)}
.tl-dot .line{width:2px;flex:1;background:var(--mist);min-height:26px}
.tl-step:last-child .line{display:none}
.tl-step.done .circle{background:var(--ok);border-color:var(--ok);color:#fff}
.tl-step.rej .circle{background:var(--bad);border-color:var(--bad);color:#fff}
.tl-step.curr .circle{background:var(--violet-hot);border-color:var(--violet-hot);color:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(123,63,242,.45)}70%{box-shadow:0 0 0 9px rgba(123,63,242,0)}100%{box-shadow:0 0 0 0 rgba(123,63,242,0)}}
.tl-body{padding-bottom:22px}.tl-body .role{font-weight:700;font-size:14px;text-transform:capitalize}
.tl-body .who{font-size:13px;color:var(--slate)}
.tl-body .sig{margin-top:8px;border:1px solid var(--mist);border-radius:10px;padding:6px;display:inline-block;background:#fff}
.tl-body .sig img{height:54px;display:block}
.dkv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.dkv .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--slate)}
.dkv .v{font-size:15px;font-weight:600}
.read-tbl tbody td{font-size:13px;padding:9px 10px}
.modal-bg{position:fixed;inset:0;background:rgba(10,1,24,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:460px}
.modal h3{font-size:20px;font-weight:700;margin-bottom:6px}
.plazo{font-size:12px;font-weight:700;border-radius:999px;padding:6px 14px;white-space:nowrap}
.plazo.ok{background:#E8F7EE;color:#1E8B45}
.plazo.urge{background:#FFF3D6;color:#8A6100}
.plazo.venc{background:#FBE9E7;color:#C0392B}
.prog{height:10px;background:var(--mist);border-radius:999px;overflow:hidden;margin:14px 0 16px}
.prog-bar{height:100%;border-radius:999px;transition:width .4s ease}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpis span{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--slate);margin-bottom:3px}
.kpis b{font-size:17px;color:var(--ink);font-weight:800}
@media(max-width:680px){.kpis{grid-template-columns:1fr 1fr}}
.st-comprobando{background:#FFF3D6;color:#8A6100}
.st-sellado{background:#EDE9F6;color:var(--violet)}
.warnbox{background:#FFF8E6;border:1px solid #F0DFA8;border-radius:12px;padding:14px 16px;font-size:13px;color:#6B5200;line-height:1.55;margin-bottom:14px}
.warnbox b{color:#4A3800}
.warnbox li{margin-bottom:3px}
.fiscalbox{display:flex;gap:24px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;background:var(--paper);border:1px solid var(--mist);border-left:4px solid var(--violet);border-radius:16px;padding:20px 24px}
.fiscal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.fiscal-grid span{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--slate)}
.fiscal-grid b{font-size:13.5px;color:var(--ink);font-weight:600}
@media(max-width:680px){.fiscal-grid{grid-template-columns:1fr}}
.mrow{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:13px}
.mrow:hover{background:var(--paper)}
.mrow input{width:16px;height:16px;accent-color:var(--violet);flex:none;cursor:pointer}
.sigpad{border:1.5px dashed var(--mist);border-radius:12px;touch-action:none;width:100%;height:180px;background:#fff;cursor:crosshair}
.seg{display:flex;background:var(--mist);border-radius:12px;padding:4px;margin:14px 0}
.seg button{flex:1;background:transparent;color:var(--slate);padding:9px;font-size:13px}
.seg button.on{background:#fff;color:var(--violet);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.foot-aphorism{background:var(--indigo);color:rgba(255,255,255,.7);text-align:center;padding:26px;font-size:13px}
.foot-aphorism i{color:#fff}
.spinner{width:40px;height:40px;border:3px solid var(--mist);border-top-color:var(--violet-hot);border-radius:50%;animation:spin .8s linear infinite;margin:60px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:12px;font-size:14px;z-index:200;box-shadow:var(--shadow)}
.banner{background:#faf7ff;border:1px solid #e6d9ff;border-radius:12px;padding:12px 16px;font-size:13px;color:var(--violet);margin-bottom:18px}
</style>
</head>

/* ---------- número a letras (MXN) ---------- */
function numeroALetras(num){
  num=Number(num)||0;const ent=Math.floor(num),cent=Math.round((num-ent)*100);
  const Uni=['','UNO','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE'];
  const Dec=['','','VEINTI','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
  const Cen=['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  function sec(n){if(n===0)return'';if(n===100)return'CIEN';const c=Math.floor(n/100),u=n%10,dd=n%100,d=Math.floor(dd/10);let t='';if(c)t+=Cen[c]+' ';if(dd<=20)t+=Uni[dd];else if(dd<30)t+='VEINTI'+Uni[u];else{t+=Dec[d];if(u)t+=' Y '+Uni[u];}return t.trim();}
  function conv(n){if(n===0)return'CERO';let t='';const mill=Math.floor(n/1000000),miles=Math.floor((n%1000000)/1000),r=n%1000;if(mill)t+=(mill===1?'UN MILLÓN':sec(mill)+' MILLONES')+' ';if(miles)t+=(miles===1?'MIL':sec(miles)+' MIL')+' ';if(r)t+=sec(r);return t.trim();}
  return conv(ent)+' PESOS '+String(cent).padStart(2,'0')+'/100 M.N.';
}

async function init(){
  try{ STATE.pendingVer=new URLSearchParams(location.search).get('ver'); }catch(e){}

function route(){
  window.scrollTo(0,0);
  if(!STATE.user)return renderAuth();
  if(!STATE.profile)return renderProfileSetup();
  if(STATE.pendingVer){ const v=STATE.pendingVer; STATE.pendingVer=null; STATE.view='detalle'; STATE.arg=v; try{history.replaceState(null,'',location.pathname);}catch(e){} }
  switch(STATE.view){
    case 'misformatos':return renderMisFormatos();
    case 'aprobaciones':return renderAprobaciones();
    case 'nuevo':return renderNuevo(STATE.arg);
    case 'detalle':return renderDetalle(STATE.arg);
    case 'comprobar':return renderComprobar(STATE.arg);
    case 'finanzas':return renderFinanzas();
    case 'equipo':return renderEquipo();
    default:return renderLanding();
  }
}

async function doAuth(){
  const em=$('#em').value.trim(),pw=$('#pw').value;
  if(!em||!pw)return authMsg('Ingresa correo y contraseña.','err');
  const btn=$('#authBtn');btn.disabled=true;btn.textContent='...';
  try{
    if(authMode==='register'){
      const rn=$('#rn').value.trim();
      const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:rn}}});
      if(error)throw error;
      if(!data.session){authMsg('Cuenta creada. Revisa tu correo para confirmar y luego inicia sesión.','ok');authMode='login';setTimeout(renderAuth,2400);return;}
      STATE.user=data.user;STATE.token=data.session.access_token;
    }else{
      const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
      if(error)throw error;STATE.user=data.user;STATE.token=data.session?data.session.access_token:null;
    }

const DIA=86400000;
const TZ='America/Mexico_City';
// El plazo siempre se lee en hora de Mexico, no en la del equipo del usuario.
const fmtMX=(d,o={})=>new Date(d).toLocaleDateString('es-MX',{timeZone:TZ,...o});
function diasRestantes(vence){ return Math.ceil((new Date(vence).getTime()-Date.now())/DIA); }
function plazoTxt(vence){
  const d=diasRestantes(vence);
  if(d<0) return {txt:'Plazo vencido', cls:'venc'};
  if(d===0)return {txt:'Vence hoy', cls:'venc'};
  if(d===1)return {txt:'Queda 1 día', cls:'urge'};
  if(d<=2) return {txt:`Quedan ${d} días`, cls:'urge'};
  return {txt:`Quedan ${d} días`, cls:'ok'};
}

async function handleCompFiles(files,subId){
  if(!files||!files.length)return;
  for(const f of files){
    const path=`${STATE.user.id}/${subId}/comp_${Date.now()}_${f.name.replace(/[^\w.\-]/g,'_')}`;
    toast('Subiendo '+f.name+'…');
    const {error:up}=await sb.storage.from(BUCKET).upload(path,f,{upsert:false});
    if(up){toast('Error: '+up.message);continue;}
    const {data,error}=await db.from('attachments').insert({submission_id:subId,file_name:f.name,file_type:fileType(f.name),storage_path:path,size_bytes:f.size,uploaded_by:STATE.user.id}).select().single();
    if(error){toast('Error registrando adjunto');continue;}
    STATE.catts.push(data);
    if(fileType(f.name)==='xml'){const cb=$('#c_facturado');if(cb&&!cb.checked){cb.checked=true;toast('Detecté un XML: lo marqué como facturado');}}
  }
  const el=$('#cattList');
  if(el)el.innerHTML=STATE.catts.map(a=>`<div class="att"><span class="tag ${a.file_type}">${a.file_type}</span><span class="nm">${esc(a.file_name)}</span></div>`).join('');
}
async function agregarComprobante(subId){
  const imp=parseFloat(($('#c_importe')||{}).value||'0');
  if(!(imp>0))return toast('Pon el importe del comprobante.');
  const facturado=$('#c_facturado').checked;
  const rfc=($('#c_rfc').value||'').trim().toUpperCase();
  if(facturado&&!rfc)return toast('Si viene facturado, necesito el RFC del emisor.');
  const btn=$('#addComp');btn.disabled=true;btn.textContent='Guardando…';
  const {error}=await db.from('comprobantes').insert({
    submission_id:subId, fecha:$('#c_fecha').value||null, concepto:($('#c_concepto').value||'').trim(),
    proveedor:($('#c_proveedor').value||'').trim(), rfc_emisor:rfc||null, importe:imp, facturado,
    attachment_id:(STATE.catts&&STATE.catts.length)?STATE.catts[STATE.catts.length-1].id:null,
    created_by:STATE.user.id});
  if(error){btn.disabled=false;btn.textContent='Agregar comprobante';return toast(error.message);}
  toast('Comprobante agregado ✓');renderComprobar(subId);
}

/* =================== BORRADOR: compartir / descargar =================== */
const FN_URL=SUPABASE_URL+'/functions/v1/enviar-contrato';
function authToken(){
  if(STATE.token)return STATE.token;
  // Respaldo: leer el token que supabase-js deja en localStorage.
  try{ for(const k of Object.keys(localStorage)){ if(/^sb-.*-auth-token$/.test(k)){ const v=JSON.parse(localStorage.getItem(k)); if(v&&v.access_token)return v.access_token; } } }catch(_e){}
  return null;
}
async function callFn(payload){
  const tok=authToken();
  if(!tok){ toast('Tu sesión expiró. Vuelve a entrar.'); return null; }
  const r=await fetch(FN_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},body:JSON.stringify(payload)});
  let j=null; try{ j=await r.json(); }catch(_e){}
  if(!r.ok){ toast((j&&j.error)||'Error del servidor'); return null; }
  return j;
}
function pdfDownload(b64,folio){
  const bin=atob(b64);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([a],{type:'application/pdf'}));
  const el=document.createElement('a');el.href=url;el.download=(folio||'documento')+'.pdf';document.body.appendChild(el);el.click();el.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function descargarPdf(){
  const id=await saveDraft(false);
  if(!id){toast('Guarda algo primero');return;}
  toast('Generando PDF…');
  const j=await callFn({type:'descargar',submission_id:id});
  if(!j||!j.pdf)return;
  pdfDownload(j.pdf,j.folio);toast('PDF descargado ✓');
}
async function loadMiembros(){
  if(STATE.miembros)return STATE.miembros;
  const [{data:pf},{data:os}]=await Promise.all([
    db.from('profiles').select('full_name,email,role'),
    db.from('org_seed').select('full_name,email,role')]);
  const map=new Map();
  for(const r of [].concat(os||[],pf||[])) if(r.email) map.set(r.email.toLowerCase(),{name:r.full_name||r.email,email:r.email.toLowerCase(),role:r.role});
  const me=(STATE.profile&&STATE.profile.email||'').toLowerCase();
  STATE.miembros=[...map.values()].filter(m=>m.email!==me).sort((a,b)=>a.name.localeCompare(b.name,'es'));
  return STATE.miembros;
}

function renderRows(sc){

function recalc(sc){const t=STATE.rows.reduce((s,r)=>s+(parseFloat(r[sc.total.sumCol])||0),0);STATE.total=t;if($('#totalBox'))$('#totalBox').textContent=money(t);if(sc.total.letra&&$('#f_letra'))$('#f_letra').value=numeroALetras(t);}
function fileType(n){n=n.toLowerCase();if(n.endsWith('.pdf'))return'pdf';if(n.endsWith('.xml'))return'xml';return'otro';}
async function handleFiles(files){
  if(!files||!files.length)return;const id=await ensureDraft();if(!id){toast('No se pudo crear el borrador');return;}
  for(const f of files){
    const ftype=fileType(f.name);
    const path=`${STATE.user.id}/${id}/${Date.now()}_${f.name.replace(/[^\w.\-]/g,'_')}`;
    toast('Subiendo '+f.name+'…');
    const {error:up}=await sb.storage.from(BUCKET).upload(path,f,{upsert:false});
    if(up){toast('Error: '+up.message);continue;}
    const {data,error}=await db.from('attachments').insert({submission_id:id,file_name:f.name,file_type:ftype,storage_path:path,size_bytes:f.size,uploaded_by:STATE.user.id}).select().single();
    if(error){toast('Error registrando adjunto');continue;}STATE.atts.push(data);
  }
  renderAtts();toast('Adjuntos listos');
}

async function removeAtt(id){const a=STATE.atts.find(x=>x.id===id);if(!a)return;await sb.storage.from(BUCKET).remove([a.storage_path]);await db.from('attachments').delete().eq('id',id);STATE.atts=STATE.atts.filter(x=>x.id!==id);renderAtts();}
function collectData(slug){
  const sc=FORM_SCHEMAS[slug];const d={_slug:slug};
  sc.header.forEach(f=>d[f.k]=(($('#fld_'+f.k)||{}).value)||'');
  (sc.fields||[]).forEach(f=>d[f.k]=(($('#fld_'+f.k)||{}).value)||'');
  d.rows=STATE.rows;
  if(sc.total){d.total=STATE.total||0;if(sc.total.letra)d.importe_letra=($('#f_letra')||{}).value||'';}

async function ensureDraft(){

  const ft=ftBySlug(STATE.slug);
  const {data,error}=await db.from('submissions').insert({form_type_id:ft.id,submitted_by:STATE.user.id,status:'borrador',data:collectData(STATE.slug),total_amount:STATE.total||0}).select().single();
  if(error){toast(error.message);return null;}STATE.draft=data;return data.id;

async function saveDraft(notify){const id=await ensureDraft();if(!id)return null;await db.from('submissions').update({data:collectData(STATE.slug),total_amount:STATE.total||0,updated_at:new Date().toISOString()}).eq('id',id);if(notify)toast('Borrador guardado');return id;}
async function enviar(slug){
  const sc=FORM_SCHEMAS[slug];
  const reqCol=sc.table.req;
  if(!STATE.rows.some(r=>String(r[reqCol]||'').trim()!==''&&(reqCol!=='importe'||parseFloat(r[reqCol])>0)))return toast('Agrega al menos un renglón válido.');
  for(const f of (sc.fields||[]))if(f.req&&!(($('#fld_'+f.k)||{}).value||'').trim())return toast('Completa: '+f.label);
  if(sc.attachReq&&!STATE.atts.length)return toast('Adjunta al menos un comprobante (PDF/XML).');
  const id=await saveDraft(false);if(!id)return;
  openSignModal(async(firma)=>{
    const {error}=await db.rpc('enviar_submission',{p_submission_id:id});
    if(error){toast(error.message);return;}
    if(firma)await db.from('submissions').update({data:{...collectData(slug),firma_solicitante:firma}}).eq('id',id);
    STATE.draft=null;STATE.rows=[];STATE.atts=[];STATE.slug=null;
    toast('¡Enviado! Va a aprobación.');go('misformatos');
  },sc.sign.title,sc.sign.text);
}

function openSignModal(onConfirm,title,subtitle){
  let mode='draw';const root=$('#modalRoot');
  root.innerHTML=`<div class="modal-bg"><div class="modal"><h3>${esc(title)}</h3>
    <p style="color:var(--slate);font-size:13px">${esc(subtitle||'')}</p>
    <div class="seg"><button class="on" data-m="draw">✍️ Firma dibujada</button><button data-m="button">✓ Solo aprobar</button></div>
    <div id="drawArea"><canvas class="sigpad" id="pad"></canvas><div style="text-align:right;margin-top:6px"><button class="btn-line btn-sm" id="clearPad">Limpiar</button></div></div>
    <div id="btnArea" class="hidden" style="padding:18px;background:var(--paper);border-radius:12px;font-size:14px;color:var(--slate)">Quedará registrado tu nombre, cargo y la fecha/hora de aprobación.</div>
    <div style="display:flex;gap:10px;margin-top:18px"><button class="btn-line" style="flex:1" id="cancelSign">Cancelar</button><button class="btn-primary" style="flex:1" id="confirmSign">Confirmar</button></div>
  </div></div>`;
  const canvas=$('#pad');const ctx=canvas.getContext('2d');let drawing=false,has=false;
  function fit(){const r=canvas.getBoundingClientRect();canvas.width=r.width*2;canvas.height=r.height*2;ctx.scale(2,2);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.strokeStyle='#201040';}
  setTimeout(fit,30);
  function pos(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
  function start(e){drawing=true;has=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();}
  function move(e){if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();}
  function end(){drawing=false;}
  canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
  canvas.addEventListener('touchstart',start);canvas.addEventListener('touchmove',move);canvas.addEventListener('touchend',end);
  $('#clearPad').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);has=false;};
  root.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;root.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#drawArea').classList.toggle('hidden',mode!=='draw');$('#btnArea').classList.toggle('hidden',mode==='draw');});
  $('#cancelSign').onclick=()=>root.innerHTML='';
  $('#confirmSign').onclick=async()=>{let firma=null;if(mode==='draw'){if(!has)return toast('Dibuja tu firma o elige “Solo aprobar”.');firma=canvas.toDataURL('image/png');}$('#confirmSign').disabled=true;$('#confirmSign').textContent='…';root.innerHTML='';await onConfirm(firma);};
}

  const byEmail={}; people.forEach(p=>{ if(p.email) byEmail[p.email.toLowerCase()]=p; });
  const seedEmails=new Set(seed.map(s=>(s.email||'').toLowerCase()));
  const rank={admin:0,direccion:1,finanzas:2,jefe:3,empleado:4};
  let roster=seed.map(s=>{ const p=byEmail[(s.email||'').toLowerCase()]; return {email:s.email,name:(p&&p.full_name)||s.full_name||s.email,role:(p&&p.role)||s.role,jefe:s.manager_email||'',reg:!!p}; });
  people.forEach(p=>{ if(p.email && !seedEmails.has(p.email.toLowerCase())){ const m=people.find(x=>x.id===p.manager_id); roster.push({email:p.email,name:p.full_name||p.email,role:p.role,jefe:m?m.email:'',reg:true}); } });
  roster.sort((a,b)=>((rank[a.role]??9)-(rank[b.role]??9))||String(a.name).localeCompare(String(b.name)));
  const total=roster.length, reg=roster.filter(r=>r.reg).length;
  $('#roster').innerHTML=`
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <span class="chip on">${reg} registrados</span><span class="chip">${total-reg} pendientes</span>
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(255px,1fr));margin-top:0">
    ${roster.map(r=>`<div class="panel" style="margin:0;padding:16px;display:flex;gap:12px;align-items:flex-start">
      <div class="avatar" style="flex:none;background:${r.reg?'linear-gradient(135deg,var(--violet),var(--violet-hot))':'var(--mist)'};color:${r.reg?'#fff':'var(--slate)'}">${esc(String(r.name||'?').slice(0,1).toUpperCase())}</div>
      <div style="min-width:0;flex:1">
        <div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</div>
        <div style="font-size:12px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.email)}</div>
        <div style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <span style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;background:rgba(96,48,160,.12);color:var(--violet);padding:3px 9px;border-radius:999px">${ROLES[r.role]||r.role}</span>
          <span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;${r.reg?'background:#dcfce7;color:#166534':'background:var(--mist);color:var(--slate)'}">${r.reg?'✓ Registrado':'Pendiente'}</span>
        </div>
        ${r.jefe?`<div style="font-size:11px;color:var(--slate);margin-top:7px">Jefe directo: <b style="color:var(--ink)">${esc(r.jefe)}</b></div>`:(r.role==='admin'?'':`<div style="font-size:11px;color:var(--warn);margin-top:7px">Sin jefe directo</div>`)}
      </div></div>`).join('')}
    </div>`;
  $('#team').innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Nombre</th><th>Correo</th><th style="width:150px">Rol</th><th style="width:210px">Jefe directo</th></tr></thead>
   <tbody>${people.map(p=>`<tr data-uid="${p.id}"><td>${esc(p.full_name||'—')}</td><td style="font-size:12px;color:var(--slate)">${esc(p.email||'')}</td>
     <td><select data-k="role">${Object.keys(ROLES).map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${ROLES[r]}</option>`).join('')}</select></td>
     <td><select data-k="manager_id"><option value="">— ninguno —</option>${people.filter(x=>x.id!==p.id).map(x=>`<option value="${x.id}" ${p.manager_id===x.id?'selected':''}>${esc(x.full_name||x.email)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`;
  $('#team').querySelectorAll('select').forEach(sel=>sel.onchange=async()=>{const tr=sel.closest('tr');const k=sel.dataset.k;const val=k==='manager_id'?(sel.value||null):sel.value;const {error}=await db.from('profiles').update({[k]:val}).eq('id',tr.dataset.uid);toast(error?('Error: '+error.message):'Guardado');});
}

init();
</script>
</body>
</html>
